[project]
name = "ner-link"
version = "0.1.0"
description = "Logistics Accessibility Intelligence Platform for the North Eastern Region"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "greenlet>=3.0.0",
    "geoalchemy2>=0.14.3",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.18",
    "asyncpg>=0.29.0",
    "redis>=5.0.3",
    "shapely>=2.0.3",
    "networkx>=3.2.1",
    "osmnx>=1.9.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
