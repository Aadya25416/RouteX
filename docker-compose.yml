services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nerlink_db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nerlink_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nerlink_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-nerlink}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nerlink_user} -d ${POSTGRES_DB:-nerlink}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nerlink_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nerlink_api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-nerlink_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nerlink_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-nerlink}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      CORRIDOR_NAME: ${CORRIDOR_NAME:-Guwahati-Tawang}
      CORRIDOR_MIN_LAT: ${CORRIDOR_MIN_LAT:-26.10}
      CORRIDOR_MIN_LON: ${CORRIDOR_MIN_LON:-91.50}
      CORRIDOR_MAX_LAT: ${CORRIDOR_MAX_LAT:-27.70}
      CORRIDOR_MAX_LON: ${CORRIDOR_MAX_LON:-92.80}
      MEDIA_DIR: ${MEDIA_DIR:-data/evidence}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-nerlink-super-secret-jwt-key-change-in-prod-1234567890}
      ALLOW_DEV_AUTH_HEADERS: ${ALLOW_DEV_AUTH_HEADERS:-true}
    volumes:
      - ./backend:/app/backend
      - evidence_data:/app/data/evidence
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  evidence_data:
